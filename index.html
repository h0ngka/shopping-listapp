<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --accent: #34c759;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 16px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: var(--card);
    color: var(--text);
  }
  .input-row input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .input-row button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:active {
    opacity: 0.8;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  .stats button {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
  }
  li.item .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 13px;
    color: white;
  }
  li.item.done .check {
    background: var(--accent);
  }
  li.item .label {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }
  li.item.done .label {
    text-decoration: line-through;
    color: var(--sub);
  }
  li.item .delete {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --sub: #98989d;
      --border: #38383a;
    }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <div class="input-row">
    <input id="itemInput" type="text" placeholder="살 물건을 입력하세요" maxlength="80" />
    <button id="addBtn">추가</button>
  </div>
  <div class="stats">
    <span id="statText">0개 항목</span>
    <button id="clearDoneBtn">완료 항목 삭제</button>
  </div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyState" hidden>목록이 비어있어요. 위에서 항목을 추가해보세요!</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zqcihkadgwjeuxdgogba.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxY2loa2FkZ3dqZXV4ZGdvZ2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTAzNjAsImV4cCI6MjEwMzgyNjM2MH0.blvav-hgTNUbEFBNlKYVPWHGndzfvfXwmty1kYL5Zt4";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const TABLE = "shopping_items";

  const input = document.getElementById("itemInput");
  const addBtn = document.getElementById("addBtn");
  const listEl = document.getElementById("list");
  const statText = document.getElementById("statText");
  const emptyState = document.getElementById("emptyState");
  const clearDoneBtn = document.getElementById("clearDoneBtn");

  let items = [];

  async function load() {
    const { data, error } = await supabaseClient
      .from(TABLE)
      .select("*")
      .order("created_at", { ascending: false });
    if (error) {
      console.error("불러오기 실패:", error);
      items = [];
      return;
    }
    items = data;
  }

  function render() {
    listEl.innerHTML = "";
    emptyState.hidden = items.length > 0;

    items.forEach((item) => {
      const li = document.createElement("li");
      li.className = "item" + (item.done ? " done" : "");

      const check = document.createElement("div");
      check.className = "check";
      check.textContent = item.done ? "✓" : "";
      check.addEventListener("click", () => toggleItem(item.id));

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.text;
      label.addEventListener("click", () => toggleItem(item.id));

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "✕";
      del.addEventListener("click", () => deleteItem(item.id));

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    const doneCount = items.filter((i) => i.done).length;
    statText.textContent = `${items.length}개 항목 · ${doneCount}개 완료`;
  }

  async function addItem() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const { data, error } = await supabaseClient
      .from(TABLE)
      .insert({ text })
      .select()
      .single();
    if (error) {
      console.error("추가 실패:", error);
      return;
    }
    items.unshift(data);
    render();
    input.focus();
  }

  async function toggleItem(id) {
    const item = items.find((i) => i.id === id);
    if (!item) return;
    const nextDone = !item.done;
    const { error } = await supabaseClient
      .from(TABLE)
      .update({ done: nextDone })
      .eq("id", id);
    if (error) {
      console.error("상태 변경 실패:", error);
      return;
    }
    item.done = nextDone;
    render();
  }

  async function deleteItem(id) {
    const { error } = await supabaseClient.from(TABLE).delete().eq("id", id);
    if (error) {
      console.error("삭제 실패:", error);
      return;
    }
    items = items.filter((i) => i.id !== id);
    render();
  }

  async function clearDone() {
    const doneIds = items.filter((i) => i.done).map((i) => i.id);
    if (doneIds.length === 0) return;
    const { error } = await supabaseClient.from(TABLE).delete().in("id", doneIds);
    if (error) {
      console.error("완료 항목 삭제 실패:", error);
      return;
    }
    items = items.filter((i) => !i.done);
    render();
  }

  addBtn.addEventListener("click", addItem);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  clearDoneBtn.addEventListener("click", clearDone);

  async function init() {
    await load();
    render();
  }
  init();
</script>
</body>
</html>
